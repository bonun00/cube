<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>직접 해보기 · 3D 큐브 마스터 가이드</title>

    <link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
    <link rel="stylesheet" href="styles.css">

    <style>
        /* ===== 플레이그라운드 전용 스타일 (이 페이지에서만 사용) ===== */
        .pg-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 28px;
            width: 100%;
            max-width: 760px;
            margin-top: 40px;
        }

        .pg-cube {
            position: relative;
            width: 100%;
            max-width: 420px;
            height: 420px;
            background-color: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(0, 240, 255, 0.2);
            border-radius: 20px;
            box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.5);
            touch-action: none; /* 모바일에서 드래그 회전 시 스크롤 방지 */
        }
        .pg-cube twisty-player { width: 100%; height: 100%; }
        .pg-loading {
            position: absolute; inset: 0;
            display: flex; align-items: center; justify-content: center;
            color: var(--text-muted); font-size: 0.95rem;
        }
        .pg-loading.error { color: var(--accent-yellow); text-align: center; padding: 20px; }

        .pg-status {
            font-size: 0.9rem;
            color: var(--text-muted);
        }
        .pg-status strong { color: var(--accent-cyan); font-family: monospace; }

        /* 세션 버튼 (섞기/되돌리기/리셋) */
        .pg-session {
            display: flex; flex-wrap: wrap; justify-content: center; gap: 12px;
        }
        .pg-session button {
            display: inline-flex; align-items: center; gap: 6px;
            background-color: rgba(0, 240, 255, 0.08);
            color: var(--accent-cyan);
            border: 1px solid rgba(0, 240, 255, 0.3);
            padding: 12px 22px; border-radius: 30px;
            font-family: var(--font-family); font-size: 0.95rem; font-weight: 700;
            cursor: pointer; transition: all 0.2s ease;
        }
        .pg-session button:hover:not(:disabled) {
            background-color: rgba(0, 240, 255, 0.18);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.25);
        }
        .pg-session button:active:not(:disabled) { transform: scale(0.96); }
        .pg-session button:disabled { opacity: 0.4; cursor: default; }
        .pg-session button.primary {
            background-color: var(--accent-cyan); color: var(--bg-color);
            border-color: var(--accent-cyan); box-shadow: 0 0 15px rgba(0, 240, 255, 0.35);
        }
        .pg-session button.primary:hover:not(:disabled) { box-shadow: 0 0 25px rgba(0, 240, 255, 0.6); }

        /* 회전 버튼 패드 */
        .pg-pad { width: 100%; display: flex; flex-direction: column; gap: 18px; }
        .pg-pad-group { width: 100%; }
        .pg-pad-label {
            font-size: 0.85rem; color: var(--text-muted); margin-bottom: 10px; text-align: center;
            letter-spacing: 0.02em;
        }
        .pg-btn-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 8px;
        }
        .pg-move {
            background-color: var(--surface-color);
            color: var(--text-main);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px 0; border-radius: 10px;
            font-family: monospace; font-size: 1.05rem; font-weight: 700;
            cursor: pointer; transition: all 0.15s ease;
        }
        .pg-move:hover {
            border-color: var(--accent-cyan); color: var(--accent-cyan);
            background-color: rgba(0, 240, 255, 0.08);
        }
        .pg-move:active { transform: scale(0.94); }

        .pg-hint {
            font-size: 0.9rem; color: var(--text-muted); text-align: center;
            max-width: 560px; word-break: keep-all; line-height: 1.7;
        }
        .pg-hint strong { color: var(--accent-cyan); }

        @media (max-width: 480px) {
            .pg-cube { height: 340px; }
        }
    </style>
</head>
<body>

    <nav class="site-nav">
        <a href="index.html" class="nav-logo">
            <span class="logo-icon">🧊</span>
            <span>3D 큐브 마스터</span>
        </a>
        <input type="checkbox" id="nav-toggle-check" class="nav-toggle-input" aria-hidden="true">
        <div class="nav-panel">
            <ul class="nav-menu">
                <li><a href="notation.html" class="nav-link">기호 읽는 법</a></li>
                <li><a href="tutorial.html" class="nav-link">7단계 해법</a></li>
            </ul>
            <a href="playground.html" class="nav-cta active">직접 해보기 🚀</a>
        </div>
        <label for="nav-toggle-check" class="nav-toggle" aria-label="메뉴 열기">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
        </label>
    </nav>

    <section id="cta" class="standalone-page">
        <h2 class="section-title">직접 큐브 돌려보기</h2>
        <p class="pg-hint">
            큐브 <strong>스티커를 클릭</strong>하면 그 면이 돌아갑니다 (<strong>우클릭</strong>은 반대 방향,
            <strong>Shift+클릭</strong>은 두 층 넓게, <strong>Ctrl/⌘+클릭</strong>은 큐브 전체 회전).<br>
            <strong>빈 공간을 드래그</strong>하면 시점이 돌아갑니다. 아래 <strong>버튼</strong>으로도 조작할 수 있어요.
            기호가 헷갈리면 <a href="notation.html" class="highlight-cyan">기호 읽는 법</a>을 참고하세요.
        </p>

        <div class="pg-wrap">
            <div id="pg-cube" class="pg-cube">
                <twisty-player id="pg-player"
                    puzzle="3x3x3"
                    visualization="PG3D"
                    experimental-drag-input="auto"
                    experimental-move-press-input="basic"
                    control-panel="none"
                    background="none"></twisty-player>
                <div id="pg-loading" class="pg-loading">3D 큐브 불러오는 중…</div>
            </div>

            <div class="pg-status">이동 수: <strong id="pg-count">0</strong></div>

            <div class="pg-session">
                <button id="pg-scramble" class="primary" disabled>🔀 섞기</button>
                <button id="pg-undo" disabled>↩ 되돌리기</button>
                <button id="pg-reset" disabled>↺ 리셋(완성 상태로)</button>
            </div>

            <div class="pg-pad">
                <div class="pg-pad-group">
                    <div class="pg-pad-label">기본 회전 (한 면)</div>
                    <div class="pg-btn-grid" id="pg-basic"></div>
                </div>
                <div class="pg-pad-group">
                    <div class="pg-pad-label">넓은 회전 (바깥 두 층 · w)</div>
                    <div class="pg-btn-grid" id="pg-wide"></div>
                </div>
                <div class="pg-pad-group">
                    <div class="pg-pad-label">큐브 전체 회전 (시점)</div>
                    <div class="pg-btn-grid" id="pg-rot"></div>
                </div>
            </div>
        </div>
    </section>

    <div class="spacer"></div>

    <!-- 네비 모바일 햄버거 자동 닫힘 등 공용 스크립트 -->
    <script src="main.js"></script>

    <!-- 플레이그라운드: cubing.js twisty (공식 /v0/ 네임스페이스, 커스텀 엘리먼트) -->
    <script type="module">
        // 사이드이펙트 import: <twisty-player> 커스텀 엘리먼트를 등록한다.
        import "https://cdn.cubing.net/v0/js/cubing/twisty";

        const player = document.getElementById('pg-player');
        const loading = document.getElementById('pg-loading');
        const countEl = document.getElementById('pg-count');
        const btnScramble = document.getElementById('pg-scramble');
        const btnUndo = document.getElementById('pg-undo');
        const btnReset = document.getElementById('pg-reset');

        // 현재 사용자 이동 목록. 모델(alg)과 동기화하므로 버튼 회전과
        // 큐브 클릭 회전을 모두 카운트·되돌리기에 반영한다. (스크램블은 setup으로 따로 관리)
        let userMoves = [];

        function syncFromAlg(val) {
            const alg = (val && val.alg) ? val.alg : val;
            const s = alg ? alg.toString().trim() : "";
            userMoves = s ? s.split(/\s+/) : [];
            countEl.textContent = String(userMoves.length);
            btnUndo.disabled = userMoves.length === 0;
        }

        // 엘리먼트가 정의(업그레이드)되면 로딩 오버레이 제거 + 버튼 활성화 + 모델 구독
        const ready = customElements.whenDefined('twisty-player');
        const timeout = new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 15000));
        Promise.race([ready, timeout]).then(() => {
            loading.remove();
            [btnScramble, btnUndo, btnReset].forEach(b => b.disabled = false);
            // 모델의 alg 변화를 구독 → 클릭/버튼 모든 이동이 카운트·되돌리기에 반영됨
            player.experimentalModel.alg.addFreshListener(syncFromAlg);
        }).catch((err) => {
            loading.textContent = '큐브를 불러오지 못했습니다. 네트워크 연결을 확인하고 새로고침 해주세요.';
            loading.classList.add('error');
            console.error(err);
        });

        function doMove(move) {
            player.experimentalAddMove(move); // 한 수씩 애니메이션(리스너가 카운트 갱신)
        }

        function undo() {
            if (userMoves.length === 0) return;
            // 마지막 수를 뺀 수열로 다시 세팅하고 끝 상태로 스냅(자연스러운 되돌리기)
            player.alg = userMoves.slice(0, -1).join(" ");
            player.jumpToEnd();
        }

        function resetToSolved() {
            player.experimentalSetupAlg = "";
            player.alg = "";
            player.jumpToEnd();
        }

        // 워커/솔버 없이 즉시 동작하는 랜덤 무브 스크램블(연습용으로 충분).
        // 같은 면 연속·같은 축 3연속을 피해 자연스러운 섞임을 만든다.
        function randomScramble(len = 22) {
            const faces = ["U", "D", "L", "R", "F", "B"];
            const suffix = ["", "'", "2"];
            const axisOf = { U: "UD", D: "UD", L: "LR", R: "LR", F: "FB", B: "FB" };
            const out = [];
            let prev = null, prevPrev = null;
            while (out.length < len) {
                const f = faces[Math.floor(Math.random() * faces.length)];
                if (f === prev) continue;                                   // 같은 면 연속 금지
                if (axisOf[f] === axisOf[prev] && axisOf[f] === axisOf[prevPrev]) continue; // 같은 축 3연속 금지
                out.push(f + suffix[Math.floor(Math.random() * suffix.length)]);
                prevPrev = prev; prev = f;
            }
            return out.join(" ");
        }

        function scramble() {
            player.experimentalSetupAlg = randomScramble(); // 시작 상태 = 스크램블
            player.alg = "";
            player.jumpToEnd();
        }

        btnScramble.addEventListener('click', scramble);
        btnUndo.addEventListener('click', undo);
        btnReset.addEventListener('click', resetToSolved);

        // ----- 회전 버튼 패드 생성 -----
        function makeButtons(containerId, bases, variants) {
            const container = document.getElementById(containerId);
            bases.forEach(base => {
                variants.forEach(v => {
                    const move = base + v;
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = 'pg-move';
                    btn.textContent = move;
                    btn.setAttribute('aria-label', move + ' 회전');
                    btn.addEventListener('click', () => doMove(move));
                    container.appendChild(btn);
                });
            });
        }
        // 각 면: 시계(''), 반시계('), 180도(2)
        makeButtons('pg-basic', ["U", "D", "L", "R", "F", "B"], ["", "'", "2"]);
        makeButtons('pg-wide',  ["Uw", "Dw", "Lw", "Rw", "Fw", "Bw"], ["", "'", "2"]);
        makeButtons('pg-rot',   ["x", "y", "z"], ["", "'"]);
    </script>
</body>
</html>
